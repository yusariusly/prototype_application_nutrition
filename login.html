<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>NutriFlow - Client Portal Login</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                "primary": "#006e2f",
                "secondary": "#006a61",
                "background": "#f8f9ff",
                "surface": "#ffffff",
                "on-background": "#0b1c30"
              }
            }
          }
        }
      </script>
</head>
<body class="bg-background text-on-background font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Card -->
    <div class="bg-white max-w-sm w-full rounded-2xl p-8 border border-slate-100 shadow-2xl flex flex-col items-center animate-fade-in">
        <!-- Logo -->
        <div class="flex items-center gap-2 mb-6">
            <span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">eco</span>
            <div class="flex flex-col text-left">
                <span class="text-2xl font-bold tracking-tight text-primary leading-none">NutriFlow</span>
                <span class="text-[9px] uppercase tracking-widest text-secondary font-bold mt-1">Client Portal</span>
            </div>
        </div>

        <!-- Mode Toggle Tabs -->
        <div class="flex w-full p-1 bg-slate-100 rounded-xl mb-6 text-xs font-bold">
            <button type="button" onclick="switchLoginTab('login')" id="tab-btn-login" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-primary transition-all cursor-pointer">Sign In</button>
            <button type="button" onclick="switchLoginTab('register')" id="tab-btn-register" class="flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-800 transition-all cursor-pointer">New Patient Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="form-login" onsubmit="handleClientLogin(event)" class="w-full space-y-4">
            <h2 class="text-base font-bold text-center mb-1">Welcome Back</h2>
            <p class="text-xs text-slate-500 text-center mb-4">Enter your credentials to manage your nutrition plans & consult with dietitians.</p>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="client-email" required placeholder="sarah.j@email.com" value="sarah.j@email.com" class="w-full rounded-xl border-slate-200 text-xs px-3 py-2.5 focus:border-primary focus:ring-primary bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="client-password" required placeholder="••••••••" value="password" class="w-full rounded-xl border-slate-200 text-xs px-3 py-2.5 focus:border-primary focus:ring-primary bg-slate-50">
            </div>
            <div class="text-red-500 text-[10px] font-semibold hidden text-center" id="error-message">Invalid email or password combination. Try again.</div>

            <button type="submit" class="w-full bg-primary hover:bg-[#005321] text-white font-bold text-xs py-3 rounded-xl transition-all shadow-md mt-2 flex items-center justify-center gap-1 cursor-pointer">
                <span class="material-symbols-outlined text-[16px]">lock_open</span> Sign In
            </button>
        </form>

        <!-- Register Form -->
        <form id="form-register" onsubmit="handleClientRegister(event)" class="w-full space-y-4 hidden">
            <h2 class="text-base font-bold text-center mb-1">Create Patient Account</h2>
            <p class="text-xs text-slate-500 text-center mb-4">Register your account to unlock custom diet programs and medical intake onboarding.</p>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Full Name</label>
                <input type="text" id="reg-name" required placeholder="e.g. Alex Tan" class="w-full rounded-xl border-slate-200 text-xs px-3 py-2.5 focus:border-primary focus:ring-primary bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="reg-email" required placeholder="alex.tan@email.com" class="w-full rounded-xl border-slate-200 text-xs px-3 py-2.5 focus:border-primary focus:ring-primary bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="reg-password" required placeholder="Create password" value="password" class="w-full rounded-xl border-slate-200 text-xs px-3 py-2.5 focus:border-primary focus:ring-primary bg-slate-50">
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-[#005321] text-white font-bold text-xs py-3 rounded-xl transition-all shadow-md mt-2 flex items-center justify-center gap-1 cursor-pointer">
                <span class="material-symbols-outlined text-[16px]">person_add</span> Create Account & Start Onboarding
            </button>
        </form>
    </div>

    <script>
        function switchLoginTab(tab) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const btnLogin = document.getElementById('tab-btn-login');
            const btnRegister = document.getElementById('tab-btn-register');

            if (tab === 'register') {
                formLogin.classList.add('hidden');
                formRegister.classList.remove('hidden');
                btnLogin.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-800 transition-all cursor-pointer';
                btnRegister.className = 'flex-1 py-2 rounded-lg bg-white shadow-sm text-primary transition-all cursor-pointer';
            } else {
                formRegister.classList.add('hidden');
                formLogin.classList.remove('hidden');
                btnRegister.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-800 transition-all cursor-pointer';
                btnLogin.className = 'flex-1 py-2 rounded-lg bg-white shadow-sm text-primary transition-all cursor-pointer';
            }
        }

        function handleClientLogin(e) {
            e.preventDefault();
            const u = document.getElementById('client-email').value;
            const p = document.getElementById('client-password').value;

            if (p === 'password' || p) {
                let name = '';
                if (u === 'sarah.j@email.com') name = 'Sarah Jenkins';
                else if (u === 'm.reid@email.com') name = 'Marcus Reid';
                else if (u === 'elena.l@email.com') name = 'Elena Lopez';
                else name = u.split('@')[0].replace('.', ' ').toUpperCase();

                if (name) {
                    localStorage.setItem('nutriflow_client_logged', 'true');
                    localStorage.setItem('nutriflow_client_logged_name', name);
                    window.location.href = './index.html';
                    return;
                }
            }
            
            const err = document.getElementById('error-message');
            err.classList.remove('hidden');
        }

        function handleClientRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            if (!name || !email) return;

            // Save patient to localStorage clients list
            const existingClients = JSON.parse(localStorage.getItem('nutriflow_clients') || '[]');
            const newPatient = {
                id: `pat-${Date.now()}`,
                name: name,
                email: email,
                therapist: 'Dr. Hasan',
                goal: 'Health Improvement',
                compliance: 100,
                registered: true
            };
            existingClients.unshift(newPatient);
            localStorage.setItem('nutriflow_clients', JSON.stringify(existingClients));

            // Log patient in
            localStorage.setItem('nutriflow_client_logged', 'true');
            localStorage.setItem('nutriflow_client_logged_name', name);

            // Flag that this user needs onboarding intake form
            localStorage.setItem('nutriflow_trigger_onboarding', 'true');

            // Redirect to index.html to launch onboarding
            window.location.href = './index.html';
        }
    </script>
</body>
</html>
